[project]
name = "qa-test-authoring-poc"
version = "0.1.0"
description = "PoC: asistente de QA que convierte un documento de casos de prueba en tests Playwright revisados y registrados en Azure DevOps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.20,<4",
    "sqlmodel>=0.0.24",
    "anthropic>=0.75",
    "python-docx>=1.1",
    "httpx>=0.27",
    "playwright==1.56.0",
    "honcho>=2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_assistant", "mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
